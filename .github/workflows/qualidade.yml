name: Qualidade

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  frontend:
    name: Lint do frontend
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Dependências
        run: npm ci

      - name: Lint
        run: npm run lint -- --format=github
